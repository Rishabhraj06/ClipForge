[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Autonomous Code-to-Vertical-Shorts generator for YouTube Shorts, Reels, and TikTok."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Rishabh Raj", email = "rishabhraj06@users.noreply.github.com" }]
dependencies = [
    "Pillow>=10.0.0",
]

[project.scripts]
clipforge = "clipforge.cli:main"
